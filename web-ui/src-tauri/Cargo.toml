[package]
name = "jcode-web-ui"
version = "0.12.0"
description = "jcode Web UI - A modern coding agent interface"
authors = ["jcode team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jcode_web_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
